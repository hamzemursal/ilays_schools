name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Local dev values, not real secrets — CI runs against a disposable
  # Postgres service container, never the real Neon database.
  DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/school_erp?schema=public
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  JWT_MFA_SECRET: ci-mfa-pending-secret
  TOTP_ENCRYPTION_KEY: ci-totp-encryption-key
  PORT: 4000
  WEB_ORIGIN: http://localhost:3010
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: school_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @school-erp/database exec prisma migrate deploy
      - run: pnpm --filter @school-erp/api typecheck
      - run: pnpm --filter @school-erp/api test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: school_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @school-erp/database exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm --filter web build
      - run: pnpm --filter @school-erp/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
